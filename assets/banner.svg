<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(-18px); opacity: 0.8; }
    }
    .orb-cyan {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-purple {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 20 15;
      animation: flowLine 12s linear infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pill-bg {
      fill: #1e293b;
      fill-opacity: 0.8;
      stroke: #334155;
      stroke-width: 1;
      rx: 16;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle class="orb-cyan" cx="220" cy="120" r="140" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
  <circle class="orb-purple" cx="980" cy="280" r="160" fill="url(#glow-purple)" filter="url(#blur-glow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid-pattern)" rx="16" />

  <!-- Dynamic Data Stream Vectors (in background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 80 Q 300 20 600 90 T 1250 60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M -50 320 Q 350 380 700 310 T 1250 340" fill="none" stroke="#c084fc" stroke-width="2" />
    <path class="stream-line" d="M -50 200 Q 400 130 800 240 T 1250 180" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Memory / Cache Blocks Graphic (Abstract Geometric Flow) -->
  <g transform="translate(930, 70)" opacity="0.25">
    <rect x="0" y="0" width="60" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="75" y="0" width="60" height="45" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <rect x="150" y="0" width="60" height="45" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <rect x="0" y="60" width="60" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="75" y="60" width="60" height="45" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <rect x="150" y="60" width="60" height="45" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Floating Cache Particles -->
  <circle class="particle" cx="150" cy="280" r="3" fill="#38bdf8" style="animation-delay: 0s;" />
  <circle class="particle" cx="320" cy="60" r="4" fill="#818cf8" style="animation-delay: 1.5s;" />
  <circle class="particle" cx="820" cy="80" r="3.5" fill="#c084fc" style="animation-delay: 0.8s;" />
  <circle class="particle" cx="1060" cy="180" r="4.5" fill="#38bdf8" style="animation-delay: 2.1s;" />

  <!-- FOREGROUND TEXT (Crystal clear and high contrast) -->
  <!-- Top Tag / Pill -->
  <g transform="translate(600, 65)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#10b981" />
    <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ARCHITECTURE LIST</text>
  </g>

  <!-- Title -->
  <text class="title-text" x="600" y="145" text-anchor="middle" font-size="44" fill="url(#primary-grad)">
    Awesome Database Storage &amp; Memory
  </text>
  <text class="title-text" x="600" y="195" text-anchor="middle" font-size="44" fill="#ffffff">
    Optimization Ecosystem
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="245" text-anchor="middle" font-size="19" fill="#94a3b8">
    High-Performance In-Memory Data Stores • Caching Layers • Low-Latency Storage Engines
  </text>

  <!-- Feature Tags / Pills at Bottom -->
  <g transform="translate(180, 290)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect class="pill-bg" x="0" y="0" width="130" height="34" />
      <text class="pill-text" x="65" y="22" text-anchor="middle">⚡ Sub-ms Latency</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(145, 0)">
      <rect class="pill-bg" x="0" y="0" width="140" height="34" />
      <text class="pill-text" x="70" y="22" text-anchor="middle">🛡️ Valkey &amp; Redis</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(300, 0)">
      <rect class="pill-bg" x="0" y="0" width="145" height="34" />
      <text class="pill-text" x="72" y="22" text-anchor="middle">🚀 Dragonfly Multi-Core</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(460, 0)">
      <rect class="pill-bg" x="0" y="0" width="125" height="34" />
      <text class="pill-text" x="62" y="22" text-anchor="middle">💾 RocksDB LSM</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(600, 0)">
      <rect class="pill-bg" x="0" y="0" width="125" height="34" />
      <text class="pill-text" x="62" y="22" text-anchor="middle">☁️ Serverless Cache</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(740, 0)">
      <rect class="pill-bg" x="0" y="0" width="100" height="34" />
      <text class="pill-text" x="50" y="22" text-anchor="middle">🌐 SaaS &amp; OSS</text>
    </g>
  </g>
</svg>