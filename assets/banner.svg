<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><linearGradient id="glow-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".7"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="blur-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="40"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(25px,-15px);opacity:.65}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.2}50%{transform:translateY(-18px);opacity:.8}}.orb-cyan{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-purple{animation:pulseOrb 10s ease-in-out infinite alternate;transform-origin:1000px 300px}.stream-line{stroke-dasharray:20 15;animation:flowLine 12s linear infinite}.particle{animation:floatParticle 4s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400;letter-spacing:.2px}.pill-bg{fill:#1e293b;fill-opacity:.8;stroke:#334155;stroke-width:1;rx:16}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:13px;font-weight:600;fill:#94a3b8}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><circle cx="220" cy="120" r="140" fill="url(#glow-cyan)" class="orb-cyan" filter="url(#blur-glow)"/><circle cx="980" cy="280" r="160" fill="url(#glow-purple)" class="orb-purple" filter="url(#blur-glow)"/><rect width="1200" height="400" fill="url(#grid-pattern)" rx="16"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 80 Q 300 20 600 90 T 1250 60" class="stream-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M -50 320 Q 350 380 700 310 T 1250 340" class="stream-line"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M -50 200 Q 400 130 800 240 T 1250 180" class="stream-line"/></g><g opacity=".25" transform="translate(930, 70)"><rect width="60" height="45" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/><rect width="60" height="45" x="75" y="0" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="6"/><rect width="60" height="45" x="150" y="0" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="6"/><rect width="60" height="45" x="0" y="60" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/><rect width="60" height="45" x="75" y="60" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="6"/><rect width="60" height="45" x="150" y="60" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="6"/></g><circle cx="150" cy="280" r="3" fill="#38bdf8" class="particle" style="animation-delay:0s"/><circle cx="320" cy="60" r="4" fill="#818cf8" class="particle" style="animation-delay:1.5s"/><circle cx="820" cy="80" r="3.5" fill="#c084fc" class="particle" style="animation-delay:.8s"/><circle cx="1060" cy="180" r="4.5" fill="#38bdf8" class="particle" style="animation-delay:2.1s"/><g transform="translate(600, 65)"><rect width="280" height="32" x="-140" y="-16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="16"/><circle cx="-116" cy="0" r="5" fill="#10b981"/><text x="-98" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ARCHITECTURE LIST</text></g><text x="600" y="145" fill="url(#primary-grad)" class="title-text" font-size="44" text-anchor="middle">Awesome Database Storage &amp; Memory</text><text x="600" y="195" fill="#fff" class="title-text" font-size="44" text-anchor="middle">Optimization Ecosystem</text><text x="600" y="245" fill="#94a3b8" class="subtitle-text" font-size="19" text-anchor="middle">High-Performance In-Memory Data Stores • Caching Layers • Low-Latency Storage Engines</text><g><g transform="translate(180, 290) translate(0, 0)"><rect width="130" height="34" x="0" y="0" class="pill-bg"/><text x="65" y="22" class="pill-text" text-anchor="middle">⚡ Sub-ms Latency</text></g><g transform="translate(180, 290) translate(145, 0)"><rect width="140" height="34" x="0" y="0" class="pill-bg"/><text x="70" y="22" class="pill-text" text-anchor="middle">🛡️ Valkey &amp; Redis</text></g><g transform="translate(180, 290) translate(300, 0)"><rect width="145" height="34" x="0" y="0" class="pill-bg"/><text x="72" y="22" class="pill-text" text-anchor="middle">🚀 Dragonfly Multi-Core</text></g><g transform="translate(180, 290) translate(460, 0)"><rect width="125" height="34" x="0" y="0" class="pill-bg"/><text x="62" y="22" class="pill-text" text-anchor="middle">💾 RocksDB LSM</text></g><g transform="translate(180, 290) translate(600, 0)"><rect width="125" height="34" x="0" y="0" class="pill-bg"/><text x="62" y="22" class="pill-text" text-anchor="middle">☁️ Serverless Cache</text></g><g transform="translate(180, 290) translate(740, 0)"><rect width="100" height="34" x="0" y="0" class="pill-bg"/><text x="50" y="2